<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <table>
        <caption>Lista de ingredientes</caption>
        <thead>
            <tr>
                <th scope="col">Disciplina</th>
                <th scope="col">Carga Horária</th>
                <th scope="col">Período</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <td>Farofa</td>
                <td>2</td>
            </tr>
            <tr>
                <th>2</th>
                <td>Manjericão</td>
                <td>10</td>
            </tr>
            <tr>
                <th>3</th>
                <td>Bacalhau</td>
                <td>5</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row" colspan="2">Total de itens</th>
                <td>17</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
